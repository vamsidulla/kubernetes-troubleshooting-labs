apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-probe
  template:
    metadata:
      labels:
        app: web-probe
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-probe
spec:
  selector:
    app: web-probe
  ports:
    - name: http
      port: 80
      targetPort: http
