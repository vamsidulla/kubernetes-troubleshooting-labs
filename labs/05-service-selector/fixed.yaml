apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-selector-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-selector-lab
  template:
    metadata:
      labels:
        app: service-selector-lab
    spec:
      containers:
      - name: app
        image: busybox:1.36.1
        command:
        - sh
        - -c
        - mkdir -p /www; echo healthy > /www/index.html; exec httpd -f -p 8080 -h
          /www
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: service-selector-lab
spec:
  selector:
    app: service-selector-lab
  ports:
  - port: 80
    targetPort: http
