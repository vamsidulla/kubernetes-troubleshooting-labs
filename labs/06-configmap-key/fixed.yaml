apiVersion: v1
kind: ConfigMap
metadata:
  name: config-key-settings
data:
  MODE: learning
  APP_MODE: learning
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-key-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-key-lab
  template:
    metadata:
      labels:
        app: config-key-lab
    spec:
      containers:
      - name: app
        image: busybox:1.36.1
        command:
        - sh
        - -c
        - while true; do sleep 3600; done
        env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              name: config-key-settings
              key: APP_MODE
