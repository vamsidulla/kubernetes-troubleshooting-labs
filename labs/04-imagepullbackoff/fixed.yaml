apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-pull-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-pull-lab
  template:
    metadata:
      labels:
        app: image-pull-lab
    spec:
      containers:
      - name: app
        image: busybox:1.36.1
        command:
        - sh
        - -c
        - while true; do sleep 3600; done
