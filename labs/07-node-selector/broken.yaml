apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-selector-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-selector-lab
  template:
    metadata:
      labels:
        app: node-selector-lab
    spec:
      containers:
      - name: app
        image: busybox:1.36.1
        command:
        - sh
        - -c
        - while true; do sleep 3600; done
      nodeSelector:
        troubleshooting.example.com/placement: missing
