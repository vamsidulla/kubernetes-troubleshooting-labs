name: Validate runbooks and YAML

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Validate AKS atlas
        run: python scripts/validate_aks_atlas.py
      - name: Parse all YAML files
        run: python scripts/validate_yaml.py
